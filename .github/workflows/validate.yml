name: Validate static directory

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reject invalid UTF-8 and duplicate JSON object keys
        run: python3 scripts/check-json-duplicates.py
      - name: Validate schema, directory and admission policy
        run: node scripts/validate-directory.mjs --self-test
